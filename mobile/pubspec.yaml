name: csh_mobile
description: Construction Supply Hub - Flutter Android App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.0.7
  intl: ^0.19.0
  badges: ^3.1.2
  shimmer: ^3.0.0
  fluttertoast: ^8.2.4
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
